# ==============================================================================
# NGINX Configuration for: rce.gemshine.tech
# Frontend Path : /var/www/rce-website/dist (or your cloned workspace dist folder)
# Backend Proxy : http://127.0.0.1:5024 (Node.js PM2 process)
# ==============================================================================

# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rce.gemshine.tech;

    # Let's Encrypt SSL validation endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rce.gemshine.tech;

    # SSL Certificates (Issued via Certbot)
    ssl_certificate /etc/letsencrypt/live/rce.gemshine.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rce.gemshine.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Frontend Static Files (Vite Production Build)
    root /var/www/rce-website/dist;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static Assets Caching (Vite hashed bundles in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static media files (logos, banners, icons)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Node.js API Reverse Proxy (Port 5024)
    location /api/ {
        proxy_pass http://127.0.0.1:5024;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Frontend Single Page App (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Max upload limit (photos, receipts, files)
    client_max_body_size 25M;
}

