# ==============================================================================
# INITIAL HTTP CONFIGURATION (Use before running Certbot)
# File: /etc/nginx/sites-available/rce.gemshine.tech
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name rce.gemshine.tech;

    # Frontend Static Files
    root /var/www/rce-website/dist;
    index index.html;

    # Node.js API Reverse Proxy (Port 5024)
    location /api/ {
        proxy_pass http://127.0.0.1:5024;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend SPA Route Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

